function fnv(str){ let h=0x811c9dc5; for(let i=0;i<str.length;i++){ h^=str.charCodeAt(i); h=Math.imul(h,0x01000193); } return h>>>0; }
function rng(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(arr, r){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function R(tag){ return rng(fnv((S.sid||"0")+"|"+tag)); }

function h(tag, props, ...kids){
  const el=document.createElement(tag);
  if(props) for(const [k,v] of Object.entries(props)){
    if(v===false||v==null) continue;
    if(k==="class") el.className=v;
    else if(k==="html") el.innerHTML=v;
    else if(k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v===true?"":v);
  }
  for(const kid of kids.flat()){ if(kid==null||kid===false) continue; el.append(kid.nodeType?kid:document.createTextNode(String(kid))); }
  return el;
}

function T(step){ return S.t[step] || (S.t[step]={s:Date.now(), e:null, tries:0}); }

function mins(ms){ return Math.round(ms/6000)/10; }
function elapsed(){ const s=S.t.start&&S.t.start.s; return s? mins(Date.now()-s):0; }

function summary(){
  const p=[]; const t=S.t; const m=S.m;
  const d=(k)=> t[k]&&t[k].e ? mins(t[k].e-t[k].s)+"분" : "미완료";
  if(m.m1&&m.m1.pred) p.push(`M1 ${d("m1")} 시도${t.m1?t.m1.tries:0} 예측(배출 ${m.m1.pred.emis}%, 피해 ${m.m1.pred.dmg}%)`);
  if(m.m2) p.push(`M2 ${d("m2")} 시도${t.m2?t.m2.tries:0} 계산(${m.m2.calc||"-"} ${m.m2.val??"-"})`);
  if(m.m3) p.push(`M3 ${d("m3")} 시도${t.m3?t.m3.tries:0}`);
  if(m.m4) p.push(`M4 ${d("m4")} 시도${t.m4?t.m4.tries:0} 토글${m.m4.toggles||0}`);
  if(m.m5) p.push(`M5 ${d("m5")} 시도${t.m5?t.m5.tries:0} 환자${m.m5.pid||"-"} 질문${(m.m5.chosen||[]).join(",")} 권고${m.m5.act||"-"}`);
  if(m.end&&m.end.pasted) p.push(`마무리 ${d("end")} 붙여넣기 ${Object.keys(m.end.pasted).filter(k=>m.end.pasted[k]).join(",")||"없음"}`);
  return p.join(" | ");
}
function completionCode(){

function fields(stage){

  const f={};
  f[e.name]=S.name||""; f[e.sid]=S.sid||""; f[e.nick]=S.nick||""; f[e.stage]=stage;
  f[e.minutes]=String(elapsed()); f[e.summary]=summary();

    f[e.lines]=`① ${m.l1||""}\n② ${m.l2||""}\n③ ${m.l3||""}`;

}
function send(stage){
  if(!CFG.formAction) return;
  const f=fields(stage), body=new URLSearchParams();

  try{
    fetch(CFG.formAction,{method:"POST",mode:"no-cors",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:body.toString()})
      .then(()=>{ S.sent=(S.sent||{}); S.sent[stage]=Date.now(); save(); })
      .catch(()=>{ S.fail=(S.fail||0)+1; save(); });
  }catch(err){ S.fail=(S.fail||0)+1; save(); }
}

function plot(key, showCmp){
  const D=KANG[key]; const rows=D.rows.concat(showCmp?D.cmp:[]);
  const W=400, L=104, Rr=50, top=10, rh=32, H=top+rows.length*rh+48;
  const x=v=>L+(v-D.xmin)/(D.xmax-D.xmin)*(W-L-Rr);
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`); svg.setAttribute("width","100%"); svg.setAttribute("role","img");
  svg.setAttribute("aria-label",D.name+" 폭염 상대위험 그래프");
  let s="";
  s+=`<line class="ref" x1="${x(1)}" y1="${top-4}" x2="${x(1)}" y2="${top+rows.length*rh}"/>`;
  rows.forEach((r,i)=>{ const y=top+i*rh+rh/2; const cmp=i>=D.rows.length;
    s+=`<g class="${cmp?"cmp":""}"><text x="${L-8}" y="${y+5}" font-size="14" text-anchor="end">${r[0]}</text>`;
    s+=`<line class="ci" x1="${x(r[2])}" y1="${y}" x2="${x(r[3])}" y2="${y}"/><circle class="pt" cx="${x(r[1])}" cy="${y}" r="6"/>`;
    s+=`<text x="${W-2}" y="${y+5}" font-size="13.5" text-anchor="end">${r[1].toFixed(3)}</text></g>`;
    if(cmp && i===D.rows.length) s+=`<line class="ax" x1="8" y1="${y-rh/2}" x2="${W-4}" y2="${y-rh/2}" stroke-dasharray="2 3"/>`;
  });
  const yb=top+rows.length*rh+4;
  s+=`<line class="ax" x1="${L}" y1="${yb}" x2="${W-Rr}" y2="${yb}"/>`;
  D.ticks.forEach(t=>{ s+=`<line class="ax" x1="${x(t)}" y1="${yb}" x2="${x(t)}" y2="${yb+4}"/><text x="${x(t)}" y="${yb+18}" font-size="12.5" text-anchor="middle">${key==="ia"?t.toFixed(2):t}</text>`; });
  s+=`<text x="${(L+W-Rr)/2}" y="${yb+36}" font-size="12.5" text-anchor="middle">상대위험 RR (1 = 평소와 같음, 점선)</text>`;
  svg.innerHTML=s; return svg;
}

    const labOk=st.chosen.every(id=>st.lab[id]===QS.find(q=>q.id===id).c);
    const coreHit=st.chosen.filter(id=>P.core.includes(id)).length;
    if(!labOk){ drawQ(true); return fb.append(msg("warn","빨간 질문의 분류 다시 확인. 곳(주거, 일터) = 인지, 때(시간대) = 인시, 사람(몸, 약, 관계, 형편) = 인인")); }
    if(coreHit===0) return fb.append(msg("warn","환자 정보의 핵심 취약 요인과 연결된 질문이 없음. 환자 설명 다시 읽고 고름"));
    st.core=coreHit; st.done=true; save(); finish("m5"); render();
  }},"문진 확인");
  main.append(card("task","과제: 이 환자에게 먼저 물을 질문 세 개와 권할 것 하나",[h("p",{class:"hint",style:"margin:0"},"질문 세 개를 고르고 각각 인인, 인지, 인시로 표시"), list, h("div",{class:"label"},"권하거나 연계할 것 (하나)"), acts, btn, fb],null));
  if(st.done){
    const coreT=P.core.map(id=>QS.find(q=>q.id===id).t).join(" / ");
    const actT=P.acts.map(id=>ACTS.find(a=>a.id===id).t).join(", ");
    const c=card("","미션 5 완료",[ul([`이 환자의 핵심 질문: ${coreT} (고른 것 중 ${st.core}개 일치)`, `특히 맞는 권고: ${actT}`]), next("end")],null); main.append(c); scrollToEl(c);
  }
}

/* ---------- 마무리 ---------- */
function vEnd(){
  begin("end"); S.resume="end"; const st=S.m.end || (S.m.end={pasted:{}}); save();
  main.append(...missionHead("마무리","내 주변 한 사람과 오늘의 세 줄","정리","약 4분"));
  const mk=(key, ph, area)=>{ const el=h(area?"textarea":"input",{type:"text",placeholder:ph||"",maxlength:area?"300":"80"}); el.value=st[key]||"";
    el.addEventListener("input",()=>{ st[key]=el.value; save(); }); el.addEventListener("paste",()=>{ st.pasted[key]=true; save(); }); return el; };
  const who=mk("who","예: 외할머니, 아르바이트하던 가게 사장님");
  const pe=mk("pe","예: 옥탑방, 한낮 배달 일"), ps=mk("ps","예: 고혈압약 복용"), pa=mk("pa","예: 휴대폰 문자를 잘 못 읽음");
  const l1=mk("l1","오늘 알게 된 것",true), l2=mk("l2","10~12주차를 지나며 생각이 바뀐 지점",true), l3=mk("l3","진료실에서 해 볼 것",true);
  const q=mk("q","예: 한의원이 지역 폭염 대응 체계에 들어갈 방법",true);
  const fb=h("div");
  main.append(card("task","과제 1: 내 주변 한 사람 (실명 금지, 호칭만. 교수만 봄)",[h("div",{class:"label"},"호칭"),who,h("div",{class:"label"},"노출 한 가지"),pe,h("div",{class:"label"},"민감성 한 가지"),ps,h("div",{class:"label"},"적응역량에서 부족한 것 한 가지"),pa],null));
  main.append(card("task","과제 2: 오늘의 세 줄 (패들렛에 별명으로 공개)",[h("div",{class:"label"},"① 오늘 알게 된 것"),l1,h("div",{class:"label"},"② 10~12주차를 지나며 생각이 바뀐 지점"),l2,h("div",{class:"label"},"③ 진료실에서 해 볼 것"),l3],null));
  main.append(card("task","과제 3: 13주차 특강 질문 하나 (채수미 박사, 한국보건사회연구원)",[q],null));
  main.append(h("button",{class:"primary", onclick:()=>{ fb.innerHTML="";
    const need=[["who",2,"호칭"],["pe",2,"노출"],["ps",2,"민감성"],["pa",2,"적응역량"],["l1",8,"세 줄 ①"],["l2",8,"세 줄 ②"],["l3",8,"세 줄 ③"],["q",8,"특강 질문"]];
    for(const [k,n,lab] of need){ if((st[k]||"").trim().length<n) return fb.append(msg("warn", lab+" 입력 ("+n+"자 이상)")); }
    T("end").tries++; save(); finish("end"); S.resume="done"; save(); go("done");
  }},"제출"), fb);
}

/* ---------- 완료 ---------- */
function copyBtn(text){ return h("button",{onclick:(e)=>{ const done=()=>{ e.target.textContent="복사됨"; setTimeout(()=>e.target.textContent="복사",1500); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done,()=>fallbackCopy(text,done)); else fallbackCopy(text,done); }},"복사"); }
function fallbackCopy(text,done){ const ta=h("textarea",{style:"position:fixed;left:-9999px"}); ta.value=text; document.body.append(ta); ta.select(); try{document.execCommand("copy"); done();}catch(e){} ta.remove(); }
function vDone(){
  const m=S.m.end||{};
  main.append(h("h1",null,"12주차 미션 완료"));
  main.append(card("concept","완료 코드",[h("div",{class:"code"},completionCode()), h("p",{class:"hint",style:"margin:4px 0 0"},`총 ${S.t.end&&S.t.end.e?mins(S.t.end.e-S.t.start.s):"-"}분. 기록은 교수 설문 시트로 자동 전송됨`)],null));
  const t1=`${S.nick}\n① ${m.l1||""}\n② ${m.l2||""}\n③ ${m.l3||""}`;
  const t2=`${S.nick}: ${m.q||""}`;
  main.append(card("task","패들렛에 붙여 넣기 (제목은 별명만)",[
    h("div",{class:"label"},"'세 줄' 열"), h("div",{class:"copybox"},t1), copyBtn(t1),
    h("div",{class:"label"},"'특강 질문' 열"), h("div",{class:"copybox"},t2), copyBtn(t2),
    CFG.padlet? h("a",{class:"linkbtn",href:CFG.padlet,target:"_blank",rel:"noopener"},"패들렛 열기"):h("p",{class:"hint"},"패들렛 주소는 e-campus 공지 참고")
  ],null));
  const pf=prefillURL();
  main.append(card("","전송 확인",[h("p",{class:"small",style:"margin:0"},"인터넷이 끊겼거나 학교 망에서 전송이 막혔을 수 있음. 그런 경우 아래 버튼으로 같은 내용을 설문에 직접 제출 (이미 채워져 있음, 제출만 누름)"),
    pf? h("a",{class:"linkbtn alt",href:pf,target:"_blank",rel:"noopener"},"설문으로 직접 제출"):null],null));
}

render();
</script>
